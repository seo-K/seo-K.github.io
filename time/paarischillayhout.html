<style>
  body {
    opacity: 1;
    background: #F7F6F2;
    transition-duration: 0.5s;
    transition-property: opacity;
  }

  body.fade {
    opacity: 0;
  }
</style>
</head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>

<body id="layout" class="fade" style="overflow-x: hidden">

  <!--@import(/design/header.html)-->

  <!--@import(/design/parischillmenu.html)-->

  <div id="wrap" style="overflow-x: hidden">

    <hr class="layout">
    <div id="container">
      <hr class="layout">

      <style>
        #contents {
          max-width: 800px;
          margin: 0 auto;
        }

        @media (max-width: 767px) {
          #contents {
            padding: 0 16px;
          }
        }
      </style>
      <div id="contents">
        <!--@contents-->
        <div style="clear:both; height:0px;"></div>
      </div><!-- //contents -->
      <hr class="layout">
    </div><!-- //container -->

    <!--@import(/layout/basic/footer.html)-->
  </div><!-- //wrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.setTimeout(() => {
        document.body.classList.remove('fade');
      });
    });
  </script>
  <!--@css(/layout/basic/css/customizing.css)-->
</body>
